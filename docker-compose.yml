services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    restart: unless-stopped
    env_file: ./api/.env
    # Only MUTABLE data is volume-mounted. Reference tables (hrn_tables.json,
    # safety_distances.json, etc.) ship inside the image so every release
    # deploys its own verified lookup data — a volume over /app/data would
    # shadow updates with stale copies.
    volumes:
      - api_projects:/app/data/projects
      - api_audit:/app/data/audit
    expose:
      - "8000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    expose:
      - "80"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certbot/conf:/etc/letsencrypt:ro
      - ./deploy/certbot/www:/var/www/certbot:ro
    # Reload weekly so nginx picks up certificates renewed by the certbot
    # container — nginx keeps the old cert in memory until reloaded.
    # Certbot renews 30 days before expiry, so weekly leaves ~3 weeks margin.
    command: ["/bin/sh", "-c", "while :; do sleep 604800; nginx -s reload; done & exec nginx -g 'daemon off;'"]
    depends_on:
      - api
      - web

  certbot:
    image: certbot/certbot
    volumes:
      - ./deploy/certbot/conf:/etc/letsencrypt
      - ./deploy/certbot/www:/var/www/certbot
    entrypoint: >
      sh -c "trap exit TERM;
             while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h; done"

volumes:
  api_projects:
  api_audit:
