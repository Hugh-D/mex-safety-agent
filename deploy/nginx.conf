# HTTP only — temporary config for SSL certificate issuance
# Restore full config after certbot succeeds
server {
    listen 80;
    server_name cmse.mexeng.com.au;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
