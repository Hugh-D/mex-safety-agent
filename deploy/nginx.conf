# HTTP — redirect all traffic to HTTPS and handle certbot challenges
server {
    listen 80;
    server_name cmse.mexeng.com.au;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl;
    server_name cmse.mexeng.com.au;

    ssl_certificate     /etc/letsencrypt/live/cmse.mexeng.com.au/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cmse.mexeng.com.au/privkey.pem;

    # API — proxy to uvicorn
    location /api/ {
        proxy_pass         http://api:8000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 180s;  # AI endpoints can take up to 2 min
        client_max_body_size 20M; # allow photo/drawing uploads
    }

    # Health check (no auth required)
    location = / {
        proxy_pass http://api:8000;
    }

    # Web app — served by the web container
    location / {
        proxy_pass http://web:80;
        proxy_set_header Host $host;
    }
}
