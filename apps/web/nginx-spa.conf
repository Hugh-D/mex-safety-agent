server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # index.html: never cache — browser always revalidates so new deploys are picked up immediately
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri /index.html;
    }

    # Hashed assets: cache aggressively — Vite changes the filename on every content change
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # React SPA — serve index.html for any unknown path
    location / {
        try_files $uri $uri/ /index.html;
    }
}
